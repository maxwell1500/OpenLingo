# F-Droid build recipe for OpenLingo (com.openlingo.app).
#
# There is deliberately no Name, Summary, Description, Changelog or image
# reference below. F-Droid reads all of those from this repository's own
# fastlane/metadata/android/en-US/ tree, which is the arrangement its
# documentation recommends: metadata kept in the app's source repository is
# "strongly encouraged", it is the only way to ship an icon or screenshots,
# and it is copied into the F-Droid repo without a merge request. Duplicating
# it here would override the upstream text and then drift away from it.
#
# Field reference: https://f-droid.org/docs/Build_Metadata_Reference/
# How to submit this: README.md, section "F-Droid packaging".

Categories:
  - Science & Education
  - Reading

License: MIT

# The name as published upstream, in the copyright line of LICENSE. F-Droid's
# "App inclusion" checklist asks for an AuthorName and allows a handle.
#
# There is no AuthorEmail. This project publishes no contact address and no
# contact form on purpose: the Build Metadata Reference states the field "can
# be omitted (or left blank)", and the metadata schema, fdroid lint and the
# fdroiddata pipeline all treat it as optional. IssueTracker below is the one
# and only reporting route, by design.
AuthorName: maxwell1500

SourceCode: https://github.com/maxwell1500/OpenLingo
IssueTracker: https://github.com/maxwell1500/OpenLingo/issues

RepoType: git
Repo: https://github.com/maxwell1500/OpenLingo.git

Builds:
  - versionName: '1.1.0'
    versionCode: 2
    commit: 447e2acdf4bd80671c2cdbd0436231305d44acef
    subdir: duo-android
    # A cold build — Gradle 9.6.0 download, AGP 9.4.0, KSP, Room, Compose —
    # has no warm cache to lean on, so drop the 2-hour server default.
    timeout: 0
    prebuild:
      # Same self-heal as the "Make the Gradle wrapper executable" step in
      # .github/workflows/android.yml: the wrapper is committed 100755, but a
      # re-add from a filesystem that does not report exec bits can silently
      # record 100644 and the script then dies with "Permission denied".
      - chmod +x gradlew
    build:
      # Mirrors the CI step "Build Release APK", including the explicit
      # -PallowDebugSigning opt-in, and goes through the committed POSIX
      # wrapper rather than an ambient `gradle`. The wrapper is required:
      # AGP 9.4.0 needs the pinned Gradle 9.6.0, and the `gradle:` build
      # method would additionally have fdroidserver delete ./gradlew.
      - ./gradlew :app:assembleRelease -PallowDebugSigning
    output: app/build/outputs/apk/release/app-release.apk

  - versionName: '1.5.0_beta'
    versionCode: 6
    commit: 95a03b8d0f9ef47f57377e94f3fe3b3ea6fa75f6
    subdir: duo-android
    # A cold build — Gradle 9.6.0 download, AGP 9.4.0, KSP, Room, Compose —
    # has no warm cache to lean on, so drop the 2-hour server default.
    timeout: 0
    prebuild:
      - chmod +x gradlew
    build:
      - ./gradlew :app:assembleRelease -PallowDebugSigning
    output: app/build/outputs/apk/release/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags

CurrentVersion: '1.5.0_beta'
CurrentVersionCode: 6

MaintainerNotes: |-
  Signing: -PallowDebugSigning is mandatory, not a shortcut.
  duo-android/app/build.gradle.kts refuses to package a release artifact when
  no release key is configured, because a debug-signed "release" keeps the
  same filename and the same output path as a real one, so a green build
  would hide a wrong signature until somebody installs it. F-Droid re-signs
  every build with its own key, so the throwaway debug signature this build
  produces is discarded before the APK is published. No keystore, secret or
  credential of any kind is needed, and none is committed.

  Build method: the wrapper is invoked directly instead of using the
  `gradle:` build method. F-Droid's buildserver `gradle` is gradlew-fdroid, a
  pinned distribution that need not match what AGP 9.4.0 requires, and
  fdroidserver deletes gradlew and gradlew.bat before a `gradle:`-method
  build, which would take the wrapper away from the very command that needs
  it. Running the wrapper also pins the build to the Gradle version the
  project has actually tested, exactly as CI does.

  Toolchain: JDK 17 and Android SDK platform 36. The buildserver preinstalls
  platforms only up to android-33, but it makes $ANDROID_HOME/platforms and
  $ANDROID_HOME/build-tools group-writable and pre-accepts the SDK licences,
  so AGP installs platform 36 itself during the build.

  Metadata: name, summary, description, icon, feature graphic, screenshots,
  privacy policy and the per-version changelog all live in
  duo-android/fastlane/metadata/android/en-US/ in this repository, and
  F-Droid copies them across. Do not duplicate them in this file.

  Per release: tag the release (the tag is what UpdateCheckMode: Tags reads),
  add a Builds entry with the full 40-character commit hash, and add
  duo-android/fastlane/metadata/android/en-US/changelogs/<versionCode>.txt.
