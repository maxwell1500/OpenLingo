name: Android CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `packages` is pinned rather than left at the action default.
          # v3 shipped `tools platform-tools` by default, and the legacy
          # `tools` package was withdrawn from Google's SDK repository, so
          # sdkmanager began exiting 1 with "Failed to find package 'tools'"
          # and the job died before Gradle was ever invoked — 22 consecutive
          # red runs that never touched the code. v4 defaults to
          # `platform-tools`; stating it here means the contract no longer
          # depends on an upstream default that broke this pipeline silently
          # for eleven days.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make the Gradle wrapper executable
        working-directory: duo-android
        # Self-heal, not a workaround. The wrapper is committed with mode 100755,
        # but that bit is not self-preserving: git only carries a mode into the
        # index when core.fileMode is true, so committing this file from a
        # filesystem that does not report exec bits (Windows) with a
        # fileMode-aware git silently records 100644 instead. The runner would
        # then fail with "./gradlew: Permission denied" for a reason that has
        # nothing to do with the code. This makes that failure impossible rather
        # than merely unlikely, so CI never depends on a bit surviving transit.
        run: chmod +x gradlew

      - name: Run Unit Tests
        working-directory: duo-android
        # --rerun-tasks is mandatory: with a warm build cache the test task is
        # reported UP-TO-DATE, executes zero tests and still exits 0, so a
        # cached run would look like a green run that tested nothing.
        run: ./gradlew :app:test --rerun-tasks

      - name: Build Release APK (compile check only, NOT a distributable)
        working-directory: duo-android
        # Proves the release variant still packages. CI has no keystore and
        # never will, so the explicit -PallowDebugSigning opt-in is used and the
        # result is signed with a throwaway CI debug key. assembleRelease (not
        # bundleRelease) is chosen because it exercises the same signing path
        # AND produces an APK whose signer block can be inspected. The artifact
        # is deliberately NOT uploaded: a debug-signed "release" is exactly what
        # must never be mistaken for a shippable build.
        run: ./gradlew :app:assembleRelease -PallowDebugSigning

      - name: Build Debug APK
        working-directory: duo-android
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openlingo-debug-apk
          path: duo-android/app/build/outputs/apk/debug/app-debug.apk
